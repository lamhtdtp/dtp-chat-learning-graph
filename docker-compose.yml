# Qdrant và Redis Stack chạy qua Docker; Postgres dùng bản NATIVE (Homebrew) đã
# có sẵn trên máy dev ở cổng 5432.
#
# Vì sao Redis phải là Redis STACK (không dùng Redis native 6379): checkpointer
# Redis của LangGraph (langgraph-checkpoint-redis -> redisvl) cần module
# RediSearch (lệnh FT._LIST). Redis native Homebrew KHÔNG có module này (đã gặp
# lỗi thật "unknown command FT._LIST"). Redis Stack đóng gói sẵn RediSearch.
# Map ra 6380 để không đụng Redis native 6379 các project khác đang dùng.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6380:6379" # Redis (native đã chiếm 6379) — REDIS_URL trỏ vào 6380
      - "8001:8001" # RedisInsight UI (tuỳ chọn)
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  qdrantdata:
  redisdata:
