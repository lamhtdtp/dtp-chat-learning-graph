# Compose PRODUCTION-shaped: chạy cả app (API + worker Celery + web) cùng hạ
# tầng vector/redis (qdrant + redis-stack) bằng image tự build. Khác
# docker-compose.yml (chỉ hạ tầng cho dev, app chạy ngoài bằng venv).
#
#   docker compose -f docker-compose.app.yml up -d --build
#
# Postgres KHÔNG chạy trong compose — dùng Postgres NATIVE có sẵn trên host
# (giống môi trường của người vận hành). Container nối tới host qua
# host.docker.internal; đặt DATABASE_URL trong .env cho khớp user/DB host.
#
# API và worker DÙNG CHUNG image backend, khác lệnh chạy -> scale độc lập
# (API nhiều request nhỏ; worker batch nặng — nguyên tắc infra-observability).
services:
  redis:
    image: redis/redis-stack-server:latest # có RediSearch (checkpointer LangGraph cần)
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY}
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL}
      # Postgres native trên host — đặt DATABASE_URL trong .env dùng
      # host.docker.internal (không phải localhost) để container thấy host.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux cần dòng này; Docker Desktop đã có sẵn
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: celery -A app.ingestion.celery_app worker --loglevel=info
    environment:
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY}
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # ảnh SGK để OCR (offline) — read-only, không nằm trong image
      - ./data:/app/data:ro
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  redisdata:
  qdrantdata:
