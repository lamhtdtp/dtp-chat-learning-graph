# Compose PRODUCTION-shaped: chạy cả app (API + worker Celery + web) cùng hạ
# tầng vector/redis (qdrant + redis-stack) bằng image tự build. Khác
# docker-compose.yml (chỉ hạ tầng cho dev, app chạy ngoài bằng venv).
#
#   docker compose -f docker-compose.app.yml up -d --build
#
# Postgres KHÔNG chạy trong compose — dùng Postgres NATIVE có sẵn trên host
# (giống môi trường của người vận hành). Container nối tới host qua
# host.docker.internal; đặt DATABASE_URL trong .env cho khớp user/DB host.
#
# API và worker DÙNG CHUNG image backend, khác lệnh chạy -> scale độc lập
# (API nhiều request nhỏ; worker batch nặng — nguyên tắc infra-observability).
services:
  redis:
    image: redis/redis-stack-server:latest # có RediSearch (checkpointer LangGraph cần)
    volumes:
      - redisdata:/data
    # Publish ra host để worker VIDEO (Epic-09) chạy trên host truy cập được
    # broker/Qdrant — TTS `say`/KaTeX/ffmpeg là công cụ host, không chạy trong
    # container Linux nên video worker bắt buộc chạy ngoài.
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY}
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL}
      # Postgres native trên host. Trong container, "localhost" = chính container
      # -> phải dùng host.docker.internal. Tách biến DATABASE_URL_DOCKER để .env
      # giữ DATABASE_URL=localhost cho chạy venv, không phá lẫn nhau.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://lamthanh@host.docker.internal:5432/chat_learning}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Model đọc từ env để đổi không cần rebuild image (default = giá trị trong
      # app/config.py). Embedding hiện dùng openai/text-embedding-3-large vì
      # gemini-embedding-001 đang bị rate-limit trên VNGCloud.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-large}
      GEMINI_MODEL_CHEAP: ${GEMINI_MODEL_CHEAP:-gemini/gemini-3.1-flash-lite}
      GEMINI_MODEL_STRONG: ${GEMINI_MODEL_STRONG:-gemini/gemini-3.1-pro-preview}
      # i-Test (EPIC-10): DB ngân hàng câu hỏi ngoài (MySQL, READ-ONLY) để mời
      # học sinh làm bài trắc nghiệm. Rỗng -> tính năng tắt.
      ITEST_DATABASE_URL: ${ITEST_DATABASE_URL:-}
      ITEST_CDN_BASE: ${ITEST_CDN_BASE:-https://cdn.i-test.vn/prod/}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux cần dòng này; Docker Desktop đã có sẵn
    volumes:
      # ảnh trang SGK để endpoint /books/pages phục vụ (read-only, không trong image)
      - ./data:/app/data:ro
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: celery -A app.ingestion.celery_app worker --loglevel=info
    environment:
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY}
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://lamthanh@host.docker.internal:5432/chat_learning}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-large}
      GEMINI_MODEL_CHEAP: ${GEMINI_MODEL_CHEAP:-gemini/gemini-3.1-flash-lite}
      GEMINI_MODEL_STRONG: ${GEMINI_MODEL_STRONG:-gemini/gemini-3.1-pro-preview}
      ITEST_DATABASE_URL: ${ITEST_DATABASE_URL:-}  # đồng bộ Itest (read-only) cần DB nguồn
      ITEST_CDN_BASE: ${ITEST_CDN_BASE:-https://cdn.i-test.vn/prod/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # ảnh SGK để OCR (offline) — read-only, không nằm trong image
      - ./data:/app/data:ro
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  redisdata:
  qdrantdata:
