server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA khu quản trị: mọi route không phải file tĩnh -> index.html.
    # API admin gọi qua origin API riêng (VITE_API_URL) nên nginx này chỉ phục vụ trang.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset có hash tên file (immutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
