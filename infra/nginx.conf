server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Khu QUẢN TRỊ đã tách sang container riêng (web-admin, xem docker-compose).

    # SPA app học sinh/giáo viên: route không phải file tĩnh -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset có hash tên file (immutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
