server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Khu QUẢN TRỊ (bundle riêng admin.html). Gọi API admin đi qua origin API
    # riêng (VITE_API_URL) nên /admin ở đây chỉ phục vụ trang, không đụng API.
    location = /admin {
        try_files /admin.html =404;
    }

    # SPA app học sinh/giáo viên: route không phải file tĩnh -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset có hash tên file (immutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
