server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không phải file tĩnh -> index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset có hash tên file (immutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
