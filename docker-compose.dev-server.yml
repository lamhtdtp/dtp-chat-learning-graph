# Override cho SERVER DEV (Ubuntu + Docker): Postgres dùng RDS (ngoài),
# Redis + Qdrant chạy bằng Docker trên chính server này.
#
# Dùng KÈM base (đè lên docker-compose.app.yml):
#   docker compose -f docker-compose.app.yml -f docker-compose.dev-server.yml up -d --build
#
# Khác base: base mặc định trỏ Postgres về host (host.docker.internal) cho môi
# trường dev máy cá nhân. Override này lấy thẳng DATABASE_URL từ .env (endpoint
# RDS) và cho phép REDIS_URL trỏ Redis ngoài (Redis thường là đủ).
services:
  api:
    environment:
      # RDS: postgresql+asyncpg://USER:PASS@<rds-endpoint>:5432/<db>  (SSL: thêm ?ssl=require)
      DATABASE_URL: ${DATABASE_URL}
      # Trống -> dùng redis bundled. Trỏ Redis NGOÀI cũng được: app chỉ cần
      # get/set/incr/expire + Celery broker, KHÔNG cần RediSearch nữa (yêu cầu đó
      # mất từ khi bỏ checkpointer LangGraph ở P5).
      #
      # ĐỪNG copy REDIS_URL từ .env.example vào .env trên server: giá trị ở đó là
      # redis://localhost:6380 (cổng HOST map ra) — trong mạng compose Redis nghe
      # 6379. Sửa host thành `redis` mà để nguyên 6380 là lỗi đã gặp thật:
      # "Error 111 connecting to redis:6380". Cứ để trống cho mặc định dưới đây.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  # Worker RENDER VIDEO (Epic-09) — queue "video", image có ffmpeg/node/katex/font
  # (infra/video.Dockerfile). Mount ./data GHI ĐƯỢC để xuất mp4 + cache ảnh nền.
  video:
    build:
      context: .
      dockerfile: infra/video.Dockerfile
    command: celery -A app.ingestion.celery_app worker -Q video --loglevel=info
    environment:
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY}
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-large}
      GEMINI_MODEL_CHEAP: ${GEMINI_MODEL_CHEAP:-gemini/gemini-3.1-flash-lite}
      GEMINI_MODEL_STRONG: ${GEMINI_MODEL_STRONG:-gemini/gemini-3.1-pro-preview}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data                       # rw: xuất data/videos + cache data/scenes
      - ./data_processed:/app/data_processed
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }
