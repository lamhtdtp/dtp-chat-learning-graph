[project]
name = "chat-learning-graph"
version = "0.1.0"
description = "Chat Learning — RAG hỏi đáp Toán + sinh đề theo ma trận (LangGraph + Qdrant + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "google-genai>=0.3",
    "qdrant-client>=1.11",
    "redis>=5.0",
    "celery>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-docx>=1.1",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "langfuse>=2.50",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
