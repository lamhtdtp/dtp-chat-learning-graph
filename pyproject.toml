[project]
name = "chat-learning-graph"
version = "0.1.0"
description = "Chat Learning — RAG hỏi đáp Toán + sinh đề theo ma trận (LangGraph + Qdrant + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-redis>=0.0.5",  # checkpointer Redis (cần Redis Stack/RediSearch)
    # LLM: VNGCloud AI Platform (MaaS), KHÔNG phải Google AI trực tiếp — chat/
    # vision qua Anthropic SDK, embedding qua OpenAI SDK (xem app/llm/gateway.py).
    "anthropic>=0.40",
    "openai>=1.50",
    "qdrant-client>=1.11",
    "redis>=5.0",
    "celery>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-docx>=1.1",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "langfuse>=2.50",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",  # cho pydantic EmailStr (auth) — thiếu thì import lỗi
    "pillow>=10.4",  # dựng slide PNG cho video AI (app/video/render.py)
    "websockets>=13.0",  # đẩy trạng thái video qua WebSocket (app/api/video.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Mặc định pytest-asyncio tạo 1 event loop MỚI cho mỗi test (function-scoped).
# Engine SQLAlchemy async (app/db/session.py) là singleton dùng chung toàn bộ
# test session — connection pool của nó bị ràng buộc vào loop đã tạo ra nó, tái
# dùng ở loop khác gây lỗi asyncpg "another operation is in progress" khó hiểu.
# Dùng chung 1 loop cho cả session để engine singleton hoạt động đúng — phải
# đặt CẢ hai (fixture lẫn test function), thiếu 1 trong 2 vẫn bị lệch loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
